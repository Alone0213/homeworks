  <style type="text/tailwindcss">
    @layer utilities {
      /* 硬约束：幻灯片画布固定 1280×720，溢出由 check-layout 只读检测 */
      .ppt-slide {
        @apply relative w-[1280px] h-[720px] mx-auto box-border overflow-hidden;

      .ppt-slide *,
      .ppt-slide *::before,
      .ppt-slide *::after {

      .ppt-slide img {
        @apply max-w-full max-h-full;
      }

      .ppt-slide video,
      .ppt-slide svg {
        @apply max-w-full max-h-full object-contain;
      }
      /* 导出安全：模糊滤镜无法矢量导出，统一剥离 */
      .ppt-slide [class*="blur"],
      .ppt-slide [style*="blur"] {
        filter: none !important;
        backdrop-filter: none !important;
      }
      .ppt-slide [class*="backdrop-blur"],
      .ppt-slide [style*="backdrop-filter"] {

  <style>

    .ppt-slide > img[data-pptx-role="structural-background"] {

}

<script id="pptx-craft-page-number-footer">
function assemblePageNumberFooter() {
(function () {
  if (document.querySelector('meta[name="pptx-craft-import-mode"]')) return;
  var visualProperties = [
    'color', 'font-family', 'font-size', 'font-weight', 'font-style', 'font-variant',
    'font-stretch', 'font-feature-settings', 'font-variation-settings', 'line-height',
    'letter-spacing', 'text-transform', 'text-decoration-line', 'text-decoration-color',
    'text-decoration-style', 'text-shadow', 'background-color', 'background-image',
    'background-size', 'background-position', 'background-repeat', 'opacity', 'box-shadow',
    'border-top-width', 'border-right-width', 'border-bottom-width', 'border-left-width',
    'border-top-style', 'border-right-style', 'border-bottom-style', 'border-left-style',
    'border-top-color', 'border-right-color', 'border-bottom-color', 'border-left-color',
    'border-top-left-radius', 'border-top-right-radius', 'border-bottom-left-radius',
    'border-bottom-right-radius', 'padding-top', 'padding-right', 'padding-bottom', 'padding-left'
  ];
  document.querySelectorAll('.ppt-slide .page-footer').forEach(function (footer) {
    var slide = footer.closest('.ppt-slide');
    if (!slide || slide.hasAttribute('data-template-id') ||
        slide.querySelector('[data-template-chrome], [data-template-content]')) return;
    var numbers = Array.from(footer.querySelectorAll('[data-pptx-role="page-number"]'));
    var active = numbers.filter(function (number) {
      if (!number.textContent.trim()) {
        number.hidden = true;
        number.style.display = 'none';
        return false;
      }
      return true;
    });
    // Empty reserved slots do not create a page number or a footer on structural pages.
    if (!active.length) return;
    var align = getComputedStyle(footer).getPropertyValue('--page-number-align').trim() || 'right';
    // Capture every run before reparenting: descendant selectors and inherited colors may change.
    var snapshots = active.map(function (number) {
      return [number].concat(Array.from(number.querySelectorAll('*'))).map(function (node) {
        var style = getComputedStyle(node);
        return { node: node, values: visualProperties.map(function (key) {
          return [key, style.getPropertyValue(key)];
        }) };
      });
    });
    active.forEach(function (number, index) {
      footer.appendChild(number);
      snapshots[index].forEach(function (entry) {
        entry.values.forEach(function (pair) {
          if (pair[1]) entry.node.style.setProperty(pair[0], pair[1]);
        });
      });
      number.hidden = false;
      number.style.setProperty('position', 'static');
      number.style.setProperty('inset', 'auto');
      number.style.setProperty('flex', '0 0 auto');
      number.style.setProperty('white-space', 'nowrap');
      number.style.setProperty('margin-left', align === 'left' ? '0' : 'auto');
      number.style.setProperty('margin-right', align === 'left' ? 'auto' : '0');
      number.style.setProperty('order', align === 'left' ? '-1' : '1');
      number.style.setProperty('text-align', align === 'left' ? 'left' : 'right');
    });
    footer.hidden = false;
    footer.style.setProperty('display', 'flex');
    footer.style.setProperty('flex-direction', 'row');
    footer.style.setProperty('align-items', 'flex-end');
    footer.style.setProperty('gap', '24px');
    Array.from(footer.children).forEach(function (child) {
      if (child.getAttribute('data-pptx-role') === 'page-number') return;
      child.style.setProperty('min-width', '0');
      child.style.setProperty('width', 'auto');
      child.style.setProperty('flex', '1 1 0%');
    });
    // Custom templates share a 30px safe-area inset and 14px footer bottom padding.
    // Legacy custom pages can be recognized by their theme contract and footer-note class.
    if (footer.getAttribute('data-pptx-footer') === 'custom' ||
        (document.getElementById('theme-contract') && footer.querySelector('.page-footer-note'))) {
      footer.style.setProperty('padding-bottom', 'var(--page-footer-bottom-padding, 14px)');
    }
  });
})();
}
if (document.readyState === 'complete') assemblePageNumberFooter();
else window.addEventListener('load', assemblePageNumberFooter, { once: true });
